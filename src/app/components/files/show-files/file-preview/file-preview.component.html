<div #fileElement class="preview-container">
  <span class="preview-new-file-badge" *ngIf="!file.seenAt"> Nowy </span>
  <span class="preview-seen-file-badge" *ngIf="who === 'user' && file.seenAt">
    Widziany {{ file.seenAt }}
  </span>
  <div class="preview-file-wrapper" [ngClass]="getImageOrientation(file)">
    <p-checkbox
      (onChange)="addFileToSelected.emit(file)"
      [binary]="true"
      [ngModel]="isSelected"
      size="large"
      pTooltip="Zaznacz plik"
      tooltipPosition="bottom"
      class="preview-select-file"
    />
    <div
      *ngIf="file | isImage"
      (click)="onShowImageClick($event, file)"
      class="preview-image-wrapper"
    >
      <app-loading-spinner
        *ngIf="isLoading"
        class="preview-spinner flex-center"
      ></app-loading-spinner>
      <img
        [src]="file.thumbnailPath"
        (load)="onImageLoad()"
        (error)="onImageError()"
        alt="Załączony plik"
      />
      <div class="preview-image-overlay flex-center">
        <i class="pi pi-search-plus preview-indicator"></i>
      </div>
    </div>

    <div class="preview-file-pdf flex-center" *ngIf="file | isPdf">
      <app-pdf-thumbnail
        [file]="file"
        (click)="openPdf.emit(file)"
      ></app-pdf-thumbnail>
    </div>

    <div
      *ngIf="!(file | isImage) && !(file | isPdf)"
      class="preview-file-other flex-center"
    >
      <i class="pi pi-file"></i>
    </div>
  </div>

  <div
    [ngClass]="{ textBold: isSelected }"
    class="preview-file-name-label"
    pTooltip="{{ file.seenAt }}"
    tooltipPosition="bottom"
  >
    {{ file.fileName }}
  </div>

  <div class="preview-file-comment">
    <span (click)="triggerShowComments(file.id)">
      <i class="pi pi-comments"></i>{{ getCommentsBtnText() }}

      <p-badge
        *ngIf="getCommentsBadgeValue() !== 0"
        [value]="getCommentsBadgeValue()"
        [severity]="getCommentsBadgeSeverity()"
        [pTooltip]="getCommentsTooltip()"
        [badgeSize]="isMobile ? 'small' : 'large'"
        class="preview-file-comments-badge-position"
      ></p-badge>
    </span>
  </div>

  <div class="preview-action-btns">
    <p-button
      [label]="isMobile ? '' : 'Pobierz plik'"
      [size]="isMobile ? 'small' : 'large'"
      (click)="download.emit()"
      [disabled]="selectedFiles.length !== 0"
      severity="contrast"
      icon="pi pi-download"
      alt="Pobierz plik"
      pTooltip="Pobierz plik"
      tooltipPosition="bottom"
      styleClass="preview-download-btn"
    />

    <p-button
      [size]="isMobile ? 'small' : 'large'"
      (click)="delete.emit()"
      [disabled]="!file.canDelete || selectedFiles.length !== 0"
      severity="secondary"
      icon="pi pi-trash"
      alt="Usuń plik"
      pTooltip="Usuń plik"
      tooltipPosition="bottom"
      styleClass="preview-delete-btn"
    />
  </div>
</div>
