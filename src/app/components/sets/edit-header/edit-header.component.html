<form #form="ngForm">
  <div class="container">
    <div class="field">
      <label for="name" class="label">Inwestycja</label>
      <input
        type="text"
        pInputText
        name="name"
        id="name"
        size="large"
        class="form-field"
        [(ngModel)]="name"
      />
    </div>
    <div class="field">
      <label for="address" class="label">Adres inwestycji</label>
      <textarea
        rows="5"
        pTextarea
        fluid
        name="address"
        id="address"
        [(ngModel)]="address"
      ></textarea>
    </div>
    <div class="field">
      <label for="status" class="label">Status</label>
      <p-select
        name="selectedStatus"
        optionLabel="label"
        optionValue="label"
        id="status"
        class="form-field"
        [options]="statuses"
        [(ngModel)]="selectedStatus"
      />
    </div>

    <div class="field bookmarks-container">
      <label for="bookmarks" class="label">Zakładki</label>
      @if (isLoading) {
        <app-loading-spinner [size]="100"></app-loading-spinner>
      } @else {
        <div *ngFor="let bookmark of allBookmarks" class="bookmarks-cell">
          <p-checkbox
            size="large"
            class="bookmarks-checkbox"
            [name]="'bookmark-' + bookmark.id"
            [inputId]="'bookmark-' + bookmark.id"
            [value]="bookmark"
            [(ngModel)]="selectedBookmarks"
          ></p-checkbox>

          <label [for]="'bookmark-' + bookmark.id" class="ml-2">
            {{ bookmark.name }}
          </label>
        </div>
      }
    </div>

    <div class="field bookmarks-container">
      <label class="label">Widoczność elementów dla klienta</label>
      <div *ngFor="let show of setVisibility | keyvalue" class="bookmarks-cell">
        <p-checkbox
          size="large"
          class="bookmarks-checkbox"
          [name]="'visibility-' + show.key"
          [inputId]="'visibility-' + show.key"
          [binary]="true"
          [(ngModel)]="show.value.visible"
        ></p-checkbox>

        <label [for]="'visibility-' + show.key" class="ml-2">
          {{ show.value.label }}
        </label>
      </div>
    </div>

    <div class="actions">
      <p-button
        severity="contrast"
        label="Anuluj"
        icon="pi pi-times"
        text
        size="large"
        (click)="closeModal.emit()"
      />
      <p-button
        severity="contrast"
        label="Zapisz"
        icon="pi pi-check"
        size="large"
        (click)="save()"
      />
    </div>
  </div>
</form>
