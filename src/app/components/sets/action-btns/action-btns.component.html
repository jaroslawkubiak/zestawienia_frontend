<div class="position-actions">
  <p-button
    severity="contrast"
    icon="pi pi-plus"
    class="m-4"
    alt="Nowa pusta pozycja"
    pTooltip="Nowa pusta pozycja"
    positionLeft="5"
    (click)="triggerAddEmptyPosition()"
  />
  <p-button
    severity="contrast"
    icon="pi pi-clone"
    class="m-4"
    alt="Klonuj pozycję"
    pTooltip="Klonuj pozycję"
    positionLeft="5"
    (click)="triggerClonePosition()"
  />
  <p-button
    severity="contrast"
    class="m-4"
    icon="pi pi-trash"
    alt="Usuń pozycję"
    pTooltip="Usuń pozycję"
    positionLeft="5"
    (click)="triggerDeletePosition()"
  />
  <p-button
    severity="contrast"
    icon="pi pi-comments"
    class="m-4"
    alt="Zobacz komentarze"
    pTooltip="Zobacz komentarze"
    positionLeft="5"
    (click)="triggerShowComments()"
  />
  <p-badge
    class="comments-value-badge"
    badgeSize="large"
    positionLeft="5"
    *ngIf="getCommentsBadgeValue(positionId)"
    [value]="getCommentsBadgeValue(positionId)"
    [severity]="getCommentsBadgeSeverity(positionId)"
    [pTooltip]="getCommentsBadgeTooltip(positionId)"
  ></p-badge>
</div>
